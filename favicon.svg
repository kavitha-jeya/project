<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB338"/>
      <stop offset="100%" stop-color="#FF9700"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="#071D38" stroke="url(#favGrad)" stroke-width="5"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="#FF9700" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>

  <!-- Building 1 (Left) -->
  <rect x="23" y="52" width="15" height="28" fill="#F4F6F8" opacity="0.85" rx="1"/>
  <!-- Building 2 (Center) -->
  <polygon points="41,80 41,38 59,38 59,80" fill="#FFFFFF"/>
  <rect x="44" y="44" width="4" height="6" fill="#071D38"/>
  <rect x="52" y="44" width="4" height="6" fill="#071D38"/>
  <rect x="44" y="54" width="4" height="6" fill="#071D38"/>
  <rect x="52" y="54" width="4" height="6" fill="#071D38"/>
  <rect x="44" y="64" width="4" height="6" fill="#071D38"/>
  <rect x="52" y="64" width="4" height="6" fill="#071D38"/>

  <!-- Building 3 (Right) -->
  <polygon points="61,80 61,46 77,46 77,80" fill="#F4F6F8" opacity="0.9"/>

  <!-- Crane Mast -->
  <line x1="68" y1="18" x2="68" y2="46" stroke="#FF9700" stroke-width="3"/>
  <line x1="72" y1="18" x2="72" y2="46" stroke="#FF9700" stroke-width="3"/>
  <line x1="68" y1="24" x2="72" y2="30" stroke="#FF9700" stroke-width="1.5"/>
  <line x1="72" y1="24" x2="68" y2="30" stroke="#FF9700" stroke-width="1.5"/>
  <line x1="68" y1="34" x2="72" y2="40" stroke="#FF9700" stroke-width="1.5"/>
  <line x1="72" y1="34" x2="68" y2="40" stroke="#FF9700" stroke-width="1.5"/>

  <!-- Cabin -->
  <rect x="65" y="16" width="10" height="7" fill="#FF9700" rx="1"/>
  <polygon points="70,9 66,16 74,16" fill="#FF9700"/>

  <!-- Crane Jib -->
  <line x1="15" y1="17" x2="88" y2="17" stroke="#FF9700" stroke-width="3.5"/>
  <line x1="70" y1="9" x2="28" y2="17" stroke="#FF9700" stroke-width="1.5"/>
  <line x1="70" y1="9" x2="52" y2="17" stroke="#FF9700" stroke-width="1.5"/>
  <line x1="70" y1="9" x2="84" y2="17" stroke="#FF9700" stroke-width="1.5"/>
  <rect x="80" y="14" width="7" height="6" fill="#FFFFFF" rx="0.5"/>

  <!-- Hoist Cable -->
  <rect x="36" y="17" width="5" height="3" fill="#FFFFFF"/>
  <line x1="38.5" y1="20" x2="38.5" y2="33" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="1 1"/>
  <path d="M38.5,33 C38.5,36 41.5,36 41.5,33" fill="none" stroke="#FF9700" stroke-width="2" stroke-linecap="round"/>

  <!-- Base Line -->
  <line x1="18" y1="80" x2="82" y2="80" stroke="#FF9700" stroke-width="4" stroke-linecap="round"/>
</svg>
